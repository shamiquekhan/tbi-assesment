<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift-Proof Countdown Timer</title>
    <style>
        :root {
            --bg: #0f0f23;
            --text: #e0e0e0;
            --accent: #e94560;
            --accent-hover: #c73e54;
            --secondary: #16213e;
            --secondary-hover: #0f3460;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }
        #timer {
            font-size: 8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
            color: var(--accent);
            transition: color 0.3s;
        }
        #timer.warning { color: #ff9f43; }
        #timer.danger { color: #ff6b6b; }
        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        button {
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            color: #fff;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        #startBtn { background: var(--secondary-hover); display: inline-block; }
        #startBtn:hover { background: var(--secondary); }
        #pauseBtn { background: var(--accent); display: none; }
        #pauseBtn:hover { background: var(--accent-hover); }
        #resumeBtn { background: var(--secondary-hover); display: none; }
        #resumeBtn:hover { background: var(--secondary); }
        #resetBtn { background: #533483; display: inline-block; }
        #resetBtn:hover { background: #3f2663; }
        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div
        id="timer"
        role="timer"
        aria-live="polite"
        aria-label="Countdown timer"
    >10:00</div>
    <div class="status" id="status" aria-live="polite">Ready</div>
    <div class="controls">
        <button id="startBtn" aria-label="Start countdown">Start</button>
        <button id="pauseBtn" aria-label="Pause countdown">Pause</button>
        <button id="resumeBtn" aria-label="Resume countdown">Resume</button>
        <button id="resetBtn" aria-label="Reset countdown">Reset</button>
    </div>

    <script>
        const TOTAL_MS = 600 * 1000;

        const State = {
            READY: 'READY',
            RUNNING: 'RUNNING',
            PAUSED: 'PAUSED',
            FINISHED: 'FINISHED'
        };

        function createTimerEngine(clock = () => performance.now()) {
            let state = State.READY;
            let remainingMs = TOTAL_MS;
            let endTime = 0;

            function getRemaining() {
                if (state === State.RUNNING) {
                    return Math.max(0, endTime - clock());
                }
                return remainingMs;
            }

            function getState() {
                return state;
            }

            function start() {
                if (state !== State.READY && state !== State.PAUSED) return false;
                endTime = clock() + remainingMs;
                state = State.RUNNING;
                return true;
            }

            function pause() {
                if (state !== State.RUNNING) return false;
                remainingMs = Math.max(0, endTime - clock());
                if (remainingMs === 0) {
                    state = State.FINISHED;
                } else {
                    state = State.PAUSED;
                }
                return true;
            }

            function resume() {
                if (state !== State.PAUSED) return false;
                endTime = clock() + remainingMs;
                state = State.RUNNING;
                return true;
            }

            function reset() {
                state = State.READY;
                remainingMs = TOTAL_MS;
                endTime = 0;
            }

            function finish() {
                state = State.FINISHED;
                remainingMs = 0;
            }

            function isFinished() {
                return state === State.FINISHED;
            }

            function isRunning() {
                return state === State.RUNNING;
            }

            function isPaused() {
                return state === State.PAUSED;
            }

            function isReady() {
                return state === State.READY;
            }

            return {
                getRemaining,
                getState,
                start,
                pause,
                resume,
                reset,
                finish,
                isFinished,
                isRunning,
                isPaused,
                isReady
            };
        }

        const engine = createTimerEngine();
        let rafId = null;

        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const resetBtn = document.getElementById('resetBtn');

        function formatTime(ms) {
            const totalSeconds = Math.ceil(ms / 1000);
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateColor(ms) {
            timerEl.classList.remove('warning', 'danger');
            if (ms <= 10_000) timerEl.classList.add('danger');
            else if (ms <= 60_000) timerEl.classList.add('warning');
        }

        function render(ms, statusText) {
            timerEl.textContent = formatTime(ms);
            updateColor(ms);
            statusEl.textContent = statusText;
        }

        function renderState() {
            const state = engine.getState();
            const remaining = engine.getRemaining();

            startBtn.style.display = state === State.READY ? 'inline-block' : 'none';
            pauseBtn.style.display = state === State.RUNNING ? 'inline-block' : 'none';
            resumeBtn.style.display = state === State.PAUSED ? 'inline-block' : 'none';

            if (state === State.FINISHED) {
                render(0, 'Time Up');
            } else if (state === State.RUNNING) {
                render(remaining, 'Running');
            } else if (state === State.PAUSED) {
                render(remaining, 'Paused');
            } else {
                render(remaining, 'Ready');
            }
        }

        function cancelTick() {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        function scheduleTick() {
            if (rafId === null && engine.isRunning()) {
                rafId = requestAnimationFrame(tick);
            }
        }

        function tick() {
            if (!engine.isRunning()) return;

            const remaining = engine.getRemaining();
            render(remaining, 'Running');

            if (remaining === 0) {
                engine.finish();
                cancelTick();
                renderState();
                return;
            }

            rafId = requestAnimationFrame(tick);
        }

        function onStart() {
            if (engine.start()) {
                scheduleTick();
                renderState();
            }
        }

        function onPause() {
            if (engine.pause()) {
                cancelTick();
                renderState();
            }
        }

        function onResume() {
            if (engine.resume()) {
                scheduleTick();
                renderState();
            }
        }

        function onReset() {
            engine.reset();
            cancelTick();
            renderState();
        }

        document.addEventListener('visibilitychange', () => {
            if (engine.isRunning() && document.visibilityState === 'visible') {
                const remaining = engine.getRemaining();
                if (remaining === 0) {
                    engine.finish();
                    cancelTick();
                }
                renderState();
                scheduleTick();
            }
        });

        startBtn.addEventListener('click', onStart);
        pauseBtn.addEventListener('click', onPause);
        resumeBtn.addEventListener('click', onResume);
        resetBtn.addEventListener('click', onReset);

        renderState();
    </script>
</body>
</html>
